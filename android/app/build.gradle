apply plugin: 'com.android.application'

// The upload key: Play Console checks every upload against it (Play then signs the app people get
// with its own key). It lives outside the project, with its passwords, in ~/.naba-keys, never in
// git. Back that folder up: without it, a new upload key has to be requested from Google.
def uploadKeyFile = new File(System.getProperty('user.home'), '.naba-keys/upload-key.properties')
def uploadKey = new Properties()
if (uploadKeyFile.exists()) uploadKeyFile.withInputStream { uploadKey.load(it) }

android {
    namespace = "com.qurannaba.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.qurannaba.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The page fonts are already compressed; packing them again only slows the build.
    androidResources {
        noCompress += ['woff2']
    }
    signingConfigs {
        release {
            if (uploadKeyFile.exists()) {
                storeFile new File(uploadKeyFile.parentFile, uploadKey['storeFile'])
                storePassword uploadKey['storePassword']
                keyAlias uploadKey['keyAlias']
                keyPassword uploadKey['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (uploadKeyFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google sign-in with the phone's own account picker (NabaGooglePlugin).
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The mushaf inside the app (BundledQuran.java): the Quran text and the 604 page fonts from the
// site's public/, and the English and Somali translations from native/quran/translations/
// (native/make-translations.mjs), copied in on every build rather than kept a second time in git.
// They are copied plainly, to a folder outside the project (~/.naba-build): Gradle's own copying
// refuses files that a sync service such as OneDrive has turned into cloud placeholders ("not a
// regular file"), as happened while the project lived in OneDrive.
def bundledQuranDir = new File(System.getProperty('user.home'), '.naba-build/quran-assets')
def copyBundledQuran = tasks.register('copyBundledQuran') {
    doNotTrackState('The sources are OneDrive placeholders Gradle cannot snapshot')
    doLast {
        def site = new File(rootProject.projectDir, '..')
        def out = new File(bundledQuranDir, 'quran')
        def copy = { File from, File to ->
            if (!from.exists()) throw new GradleException("Missing for the bundled mushaf: ${from}")
            if (to.exists() && to.length() == from.length()) return
            to.parentFile.mkdirs()
            java.nio.file.Files.copy(from.toPath(), to.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        copy(new File(site, 'public/quran-data.json'), new File(out, 'quran-data.json'))
        (1..604).each { n -> copy(new File(site, "public/qcf/p${n}.woff2"), new File(out, "qcf/p${n}.woff2")) }
        ['en.sahih', 'so.abduh'].each { id -> copy(new File(site, "native/quran/translations/${id}.json"), new File(out, "translations/${id}.json")) }
    }
}
android.sourceSets.main.assets.srcDirs += bundledQuranDir
preBuild.dependsOn copyBundledQuran

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
