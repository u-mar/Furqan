<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Nadir — offline</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px; box-sizing: border-box; text-align: center;
    background: #fbf7ee; color: #1d1914;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .mark { width: 72px; height: 72px; border-radius: 18px; background: #000; color: #f5ecd8;
    display: flex; align-items: center; justify-content: center; font: 700 44px/1 serif; }
  h1 { margin: 6px 0 0; font: 600 22px/1.3 Georgia, serif; }
  p { margin: 0; max-width: 30ch; color: #766b57; font-size: 15px; line-height: 1.5; }
  button { margin-top: 8px; height: 44px; padding: 0 22px; border: 0; border-radius: 999px;
    background: #0d6b63; color: #fbf7ee; font-size: 15px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1513; color: #ebe4d6; }
    p { color: #a39a88; }
  }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true">ن</div>
  <h1>You're offline</h1>
  <p>This screen hasn't been saved on your phone yet. Connect to the internet and it will open, and stay available offline after that.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
