<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Naba — offline</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px; box-sizing: border-box; text-align: center;
    background: #fbf7ee; color: #1d1914;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .mark { display: block; width: 72px; height: 72px; border-radius: 17px; background: #000000; }
  h1 { margin: 6px 0 0; font: 600 22px/1.3 Georgia, serif; }
  p { margin: 0; max-width: 30ch; color: #766b57; font-size: 15px; line-height: 1.5; }
  button { margin-top: 8px; height: 44px; padding: 0 22px; border: 0; border-radius: 999px;
    background: #0d6b63; color: #fbf7ee; font-size: 15px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1513; color: #ebe4d6; }
    p { color: #a39a88; }
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="#f1f3ef"><rect x="40" y="127" width="120" height="14" rx="1.5"/><rect x="40" y="57" width="14" height="84" rx="1.5"/><rect x="93" y="99" width="14" height="42" rx="1.5"/><rect x="146" y="99" width="14" height="42" rx="1.5"/></g>
    <g fill="#e0bc74"><rect x="146" y="71" width="14" height="14" rx="1.5"/><rect x="93" y="155" width="14" height="14" rx="1.5"/><rect x="40" y="31" width="15" height="5" rx="1.5"/><rect x="40" y="31" width="5" height="16" rx="1.5"/><rect x="40" y="42" width="15" height="5" rx="1.5"/></g>
  </svg>
  <h1>You're offline</h1>
  <p>This screen hasn't been saved on your phone yet. Connect to the internet and it will open, and stay available offline after that.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
