<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Naba</title>
    <!--
      Shown by the Android app only when https://qurannaba.com can't be reached and nothing is saved
      on the phone yet (the very first launch, offline). After that the saved copy opens instead.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #f1f3ef;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 32px 24px;
        text-align: center;
      }
      svg {
        width: 72px;
        height: 72px;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 18rem;
        font-size: 0.95rem;
        line-height: 1.55;
        color: rgba(241, 243, 239, 0.66);
      }
      p[dir='rtl'] {
        font-size: 1.05rem;
      }
      button {
        margin-top: 12px;
        height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #f1f3ef;
        color: #000;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The app's mark (lib/app-logo.ts): نبأ in square Kufic. -->
      <svg viewBox="30 21 140 158" aria-hidden="true">
        <g fill="#f1f3ef">
          <rect x="40" y="127" width="120" height="14" rx="1.5" />
          <rect x="40" y="57" width="14" height="84" rx="1.5" />
          <rect x="93" y="99" width="14" height="42" rx="1.5" />
          <rect x="146" y="99" width="14" height="42" rx="1.5" />
        </g>
        <g fill="#e0bc74">
          <rect x="146" y="71" width="14" height="14" rx="1.5" />
          <rect x="93" y="155" width="14" height="14" rx="1.5" />
          <rect x="40" y="31" width="15" height="5" rx="1.5" />
          <rect x="40" y="31" width="5" height="16" rx="1.5" />
          <rect x="40" y="42" width="15" height="5" rx="1.5" />
        </g>
      </svg>
      <h1>No internet connection</h1>
      <p>Connect once to open Naba. After that it works offline too.</p>
      <p>Ku xidh internetka hal mar si aad u furto Naba. Kadib wuxuu shaqeeyaa xitaa adigoo aan internet haysan.</p>
      <p dir="rtl" lang="ar">اتصل بالإنترنت مرة واحدة لفتح نبأ. بعد ذلك يعمل دون اتصال أيضًا.</p>
      <button type="button" onclick="location.replace('https://qurannaba.com/')">Try again</button>
    </main>
  </body>
</html>
